<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Gen Dialer Tool</title>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load React, ReactDOM, and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Toast Component to replace alert()
        const Toast = ({ message, show, onClose }) => {
          if (!show) return null;
          return (
            <div className="fixed bottom-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-3 z-50 animate-fade-in-up">
              <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
              <span>{message}</span>
              <button onClick={onClose} className="ml-4 text-green-200 hover:text-white">
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </div>
          );
        };

        const initialLeadState = {
          targetName: '',
          propertyAddress: '',
          ap: '',
          mv: '',
          propertyType: '', // Residential, Commercial, Vacant Lot
          // Residential / Commercial Condition
          beds: '',
          baths: '',
          upgrades: '',
          roofAge: '',
          hvacAge: '',
          repairs: '',
          // Commercial / Vacant Size
          size: '', // Size for Com, Acres for Vacant
          // Vacant Lot specific
          zoning: '', // Res/Com
          utilities: { cable: false, gas: false, water: false, elec: false },
          // Occupancy
          occupancyType: '', // Owner, Tenant, Vacant
          rentAmount: '',
          leaseType: '', // Month-to-month, Yearly
          leaseEnd: '',
          vacantDuration: '',
          comRunBy: '', // Owner, Tenant
          // Closing
          reason: '',
          mortgage: '',
          closingTime: '',
          listed: '',
          // Confirm
          fullName: '',
          phone: '',
          bestTimeToCall: '',
          additionalNotes: ''
        };

        function LeadGenApp() {
          const [currentStep, setInternalStep] = useState('SETUP');
          const [stepHistory, setStepHistory] = useState([]);
          const [lead, setLead] = useState(initialLeadState);
          const [config, setConfig] = useState({ agentName: 'Omar Walid', fakeCallerName: 'Owen' });
          const [toast, setToast] = useState({ show: false, message: '' });

          const setCurrentStep = (nextStep) => {
            setStepHistory(prev => [...prev, currentStep]);
            setInternalStep(nextStep);
          };

          const goBack = () => {
            if (stepHistory.length === 0) return;
            const newHistory = [...stepHistory];
            const previousStep = newHistory.pop();
            setStepHistory(newHistory);
            setInternalStep(previousStep);
          };

          const showToast = (message) => {
            setToast({ show: true, message });
            setTimeout(() => setToast({ show: false, message: '' }), 3000);
          };

          const updateLead = (field, value) => {
            setLead(prev => ({ ...prev, [field]: value }));
          };

          const handleUtilityToggle = (utility) => {
            setLead(prev => ({
              ...prev,
              utilities: { ...prev.utilities, [utility]: !prev.utilities[utility] }
            }));
          };

          const resetFlow = () => {
            setLead(initialLeadState);
            setInternalStep('SETUP');
            setStepHistory([]);
          };

          const renderScript = () => {
            switch (currentStep) {
              case 'SETUP':
                return "Configure your session before dialing.";
              case 'INTRO':
                return `Hi ${lead.targetName || '[Owner Name]'}?\n\nThis is ${config.fakeCallerName}, calling about your property on ${lead.propertyAddress || '[Address]'}...`;
              case 'WRONG_NAME':
                return `Oh, I'm really sorry about that! Are you the owner of the property on ${lead.propertyAddress || '[Address]'}...`;
              case 'WRONG_NAME_NOT_OWNER':
                return `Oh, I'm really sorry about that! But since I've got you on the phone, my name is ${config.fakeCallerName} and I wanted to ask if you have any properties you are interested in selling? or if you know anyone else who might be?`;
              case 'NEW_PROPERTY_ADDRESS':
                return "Great! What is the address of the property you are looking to sell?";
              case 'INTERESTED':
                return "I'm reaching out to see if you're interested in a cash offer for this property?";
              case 'LISTED':
                return "And just to make sure here, the property is not currently listed with a realtor or on the market, correct?";
              case 'NOT_INTERESTED':
                return "I understand. Would you happen to have any OTHER property that you might consider selling? Or do you know someone who is looking to sell?";
              case 'PRICE':
                return "Great, so do you have a specific asking price or a range In mind?";
              case 'PRICE_REBUTTAL':
                return "Let me just explain that we cover all the closing costs, we buy the house as-is, so you don't have to fix anything, and we're the end-buyers, so you won't be paying anything out of pocket. So what would be your bottom line in terms of price?";
              case 'PROPERTY_TYPE':
                return "Great. Just to confirm my records, what type of property is this?";
              case 'RES_CONDITION':
                return `So as I see here, it has ${lead.beds || '[X]'} bedrooms and ${lead.baths || '[X]'} bathrooms, right?\nHave you done any updates recently?\nIs there any major or minor repairs needed?`;
              case 'COM_CONDITION':
                return `So as I see here, the size of the property is ${lead.size || '[Size]'}, right?\nHave you done any updates recently?\nIs there any major or minor repairs needed?\nHow old is the HVAC?`;
              case 'VACANT_LOT_CONDITION':
                return `So as I see here, the size of the land is ${lead.size || '[Size]'} Acres, right?\nIs the land residential or commercial?\nDoes it have access to utilities like water, electricity, gas, and cable TV?`;
              case 'OCCUPANCY':
                return "Do you currently live there, or is it rented, or vacant?";
              case 'TENANT_DETAILS':
                return "(If they worry about tenants: 'Reassure them: We can take over the tenants.')\n\nAre they on a yearly lease or month-to-month?\nHow much are they paying for rent?\n(If yearly) When does their lease expire?";
              case 'VACANT_DURATION':
                return "How long has it been vacant for?";
              case 'COM_RUN_BY':
                return "Is the business currently being run by you or by a tenant?";
              case 'REASON':
                return "This seems like a really great property. What would be the reason for selling by the way?";
              case 'REASON_INVALID':
                return "We are looking for motivated sellers. If you got a good offer, will you sell the property for sure?";
              case 'MORTGAGE':
                return "Do you currently owe a mortgage or have any liens on the property?\nIs it alright if I ask how much is currently owed in total?";
              case 'CLOSING_TIME':
                return "If we could agree on a price, how soon do you think you can sell?";
              case 'CONFIRMATION':
                return `Perfect, that's all the information I need. Let me just confirm...\nYour full name is ${lead.fullName || '[Name]'}?\nThe property we discussed is ${lead.propertyAddress || '[Address]'}?\nwhat is the best number to call you at?\nWhen is the best time to call you back?\n\n(Don't forget to ask: Do you happen to have another property you want to sell?)`;
              case 'END_LISTED':
                return "Oh, I'm really sorry about that! But since I've got you on the phone, my name is " + config.fakeCallerName + " and I wanted to ask if you have any properties you are interested in selling? or if you know anyone else who might be?";
              default:
                return "Follow the script...";
            }
          };

          const renderStepContent = () => {
            switch (currentStep) {
              case 'SETUP':
                return (
                  <div className="space-y-4 animate-fade-in">
                    <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">Your Real Name (Agent)</label>
                      <input type="text" value={config.agentName} onChange={(e) => setConfig({...config, agentName: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">Your Fake Caller Name (Script)</label>
                      <input type="text" value={config.fakeCallerName} onChange={(e) => setConfig({...config, fakeCallerName: e.target.value})} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">Expected Owner Name</label>
                      <input type="text" value={lead.targetName} onChange={(e) => updateLead('targetName', e.target.value)} placeholder="John Doe..." className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">Property Address Calling</label>
                      <input type="text" value={lead.propertyAddress} onChange={(e) => updateLead('propertyAddress', e.target.value)} placeholder="123 Main St..." className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <button onClick={() => setCurrentStep('INTRO')} className="w-full mt-6 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">Start Calling</button>
                  </div>
                );

              case 'INTRO':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => setCurrentStep('INTERESTED')} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Yes, Correct Name (Owner)</button>
                    <button onClick={() => setCurrentStep('WRONG_NAME')} className="bg-slate-800 hover:bg-slate-700 border border-red-500 text-white py-3 px-4 rounded-lg">Wrong Name</button>
                  </div>
                );

              case 'WRONG_NAME':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => setCurrentStep('INTERESTED')} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Yes, I am the owner (Wrong Name)</button>
                    <button onClick={() => setCurrentStep('WRONG_NAME_NOT_OWNER')} className="bg-slate-800 hover:bg-slate-700 text-white py-3 px-4 rounded-lg">No, I am not the owner</button>
                  </div>
                );

              case 'WRONG_NAME_NOT_OWNER':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => setCurrentStep('NEW_PROPERTY_ADDRESS')} className="bg-green-700 hover:bg-green-600 text-white py-3 px-4 rounded-lg font-bold">Yes, I have a property to sell</button>
                    <button onClick={() => setCurrentStep('NOT_INTERESTED')} className="bg-slate-800 hover:bg-slate-700 text-white py-3 px-4 rounded-lg">No, Not Interested</button>
                  </div>
                );

              case 'NEW_PROPERTY_ADDRESS':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">New Property Address</label>
                      <input type="text" value={lead.propertyAddress} onChange={(e) => updateLead('propertyAddress', e.target.value)} placeholder="Enter new address..." className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <button onClick={() => setCurrentStep('LISTED')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 px-4 rounded-lg font-bold mt-4">Continue with New Property</button>
                  </div>
                );

              case 'INTERESTED':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => setCurrentStep('LISTED')} className="bg-green-700 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg">Yes, Interested / Open to Offers</button>
                    <button onClick={() => setCurrentStep('NOT_INTERESTED')} className="bg-red-900 hover:bg-red-800 text-white py-3 px-4 rounded-lg">No, Not Interested</button>
                  </div>
                );
              
              case 'LISTED':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => setCurrentStep('PRICE')} className="bg-green-700 hover:bg-green-600 text-white py-3 px-4 rounded-lg font-bold">No, Not Listed (Proceed)</button>
                    <button onClick={() => { updateLead('listed', 'Yes'); setCurrentStep('END_LISTED'); }} className="bg-red-900 hover:bg-red-800 text-white py-3 px-4 rounded-lg">Yes, it is listed</button>
                  </div>
                );
              
              case 'END_LISTED':
                 return (
                   <div className="flex flex-col space-y-3 animate-fade-in">
                     <p className="text-red-400 mb-2 font-bold text-center">Property is listed. Ask for referrals/other properties.</p>
                     <button onClick={() => setCurrentStep('NEW_PROPERTY_ADDRESS')} className="bg-green-700 hover:bg-green-600 text-white py-3 px-4 rounded-lg font-bold">Yes, has another property</button>
                     <button onClick={resetFlow} className="bg-slate-800 hover:bg-slate-700 text-white py-3 px-4 rounded-lg">No, End Call</button>
                   </div>
                 );

              case 'NOT_INTERESTED':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in text-center">
                    <p className="text-gray-400 mb-4">If they have a referral or another property, note it down and start a new lead. Otherwise, end the call.</p>
                    <button onClick={resetFlow} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">End Call & Reset</button>
                  </div>
                );

              case 'PRICE':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">Asking Price (AP)</label>
                      <input type="text" value={lead.ap} onChange={(e) => updateLead('ap', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">Estimated Market Value (MV)</label>
                      <input type="text" value={lead.mv} onChange={(e) => updateLead('mv', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <button onClick={() => setCurrentStep('PROPERTY_TYPE')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 px-4 rounded-lg font-bold mt-4">Next: Property Type</button>
                  </div>
                );
              
              case 'PRICE_REBUTTAL':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                      <label className="block text-sm font-medium text-gray-400 mb-1">New Bottom Line Asking Price</label>
                      <input type="text" value={lead.ap} onChange={(e) => updateLead('ap', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <button onClick={() => {
                        const nextStep = lead.propertyType === 'Residential' ? 'OCCUPANCY' :
                                         lead.propertyType === 'Commercial' ? 'COM_RUN_BY' : 'REASON';
                        setCurrentStep(nextStep);
                    }} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 px-4 rounded-lg font-bold mt-4">Continue</button>
                  </div>
                );

              case 'PROPERTY_TYPE':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => { updateLead('propertyType', 'Residential'); setCurrentStep('RES_CONDITION'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Residential</button>
                    <button onClick={() => { updateLead('propertyType', 'Commercial'); setCurrentStep('COM_CONDITION'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Commercial</button>
                    <button onClick={() => { updateLead('propertyType', 'Vacant Lot'); setCurrentStep('VACANT_LOT_CONDITION'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Vacant Lot</button>
                  </div>
                );

              case 'RES_CONDITION':
                return (
                  <div className="space-y-3 animate-fade-in">
                     <div className="flex space-x-3">
                       <div className="flex-1">
                         <label className="block text-xs text-gray-400 mb-1">Beds</label>
                         <input type="text" value={lead.beds} onChange={(e) => updateLead('beds', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                       </div>
                       <div className="flex-1">
                         <label className="block text-xs text-gray-400 mb-1">Baths</label>
                         <input type="text" value={lead.baths} onChange={(e) => updateLead('baths', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                       </div>
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Roof Age</label>
                        <input type="text" value={lead.roofAge} onChange={(e) => updateLead('roofAge', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">HVAC Age</label>
                        <input type="text" value={lead.hvacAge} onChange={(e) => updateLead('hvacAge', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Upgrades (Kitchen/Bath)</label>
                        <input type="text" value={lead.upgrades} onChange={(e) => updateLead('upgrades', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Needed Repairs</label>
                        <input type="text" value={lead.repairs} onChange={(e) => updateLead('repairs', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div className="flex space-x-3 pt-4">
                       <button onClick={() => setCurrentStep('OCCUPANCY')} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Next (AP &lt; MV)</button>
                       <button onClick={() => setCurrentStep('PRICE_REBUTTAL')} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white py-3 rounded font-bold">Rebuttal (AP &gt; MV)</button>
                     </div>
                  </div>
                );

              case 'COM_CONDITION':
                 return (
                  <div className="space-y-3 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Size (SqFt)</label>
                        <input type="text" value={lead.size} onChange={(e) => updateLead('size', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">HVAC Age</label>
                        <input type="text" value={lead.hvacAge} onChange={(e) => updateLead('hvacAge', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Recent Upgrades</label>
                        <input type="text" value={lead.upgrades} onChange={(e) => updateLead('upgrades', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Needed Repairs</label>
                        <input type="text" value={lead.repairs} onChange={(e) => updateLead('repairs', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div className="flex space-x-3 pt-4">
                       <button onClick={() => setCurrentStep('COM_RUN_BY')} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Next (AP &lt; MV)</button>
                       <button onClick={() => setCurrentStep('PRICE_REBUTTAL')} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white py-3 rounded font-bold">Rebuttal (AP &gt; MV)</button>
                     </div>
                  </div>
                );

              case 'VACANT_LOT_CONDITION':
                 return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Size (Acres)</label>
                        <input type="text" value={lead.size} onChange={(e) => updateLead('size', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Zoning (Residential / Commercial)</label>
                        <input type="text" value={lead.zoning} onChange={(e) => updateLead('zoning', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-2">Access to Utilities?</label>
                        <div className="grid grid-cols-2 gap-2">
                          {['cable', 'gas', 'water', 'elec'].map(util => (
                            <button key={util} onClick={() => handleUtilityToggle(util)} className={`py-2 px-3 rounded text-sm ${lead.utilities[util] ? 'bg-green-600 text-white' : 'bg-slate-700 text-gray-300'}`}>
                              {util.charAt(0).toUpperCase() + util.slice(1)}
                            </button>
                          ))}
                        </div>
                     </div>
                     <div className="flex space-x-3 pt-4">
                       <button onClick={() => setCurrentStep('REASON')} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Next (AP &lt; MV)</button>
                       <button onClick={() => setCurrentStep('PRICE_REBUTTAL')} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white py-3 rounded font-bold">Rebuttal (AP &gt; MV)</button>
                     </div>
                  </div>
                );

              case 'OCCUPANCY':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => { updateLead('occupancyType', 'Owner Occupied'); setCurrentStep('REASON'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Owner Occupied</button>
                    <button onClick={() => { updateLead('occupancyType', 'Tenant Occupied'); setCurrentStep('TENANT_DETAILS'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Tenant Occupied</button>
                    <button onClick={() => { updateLead('occupancyType', 'Vacant'); setCurrentStep('VACANT_DURATION'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Vacant</button>
                  </div>
                );

              case 'TENANT_DETAILS':
                return (
                  <div className="space-y-3 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Rent Amount</label>
                        <input type="text" value={lead.rentAmount} onChange={(e) => updateLead('rentAmount', e.target.value)} placeholder="$..." className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-2">Lease Type</label>
                        <div className="flex space-x-2">
                          <button onClick={() => updateLead('leaseType', 'Month to Month')} className={`flex-1 py-2 rounded text-sm ${lead.leaseType === 'Month to Month' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-gray-300'}`}>Month to Month</button>
                          <button onClick={() => updateLead('leaseType', 'Yearly')} className={`flex-1 py-2 rounded text-sm ${lead.leaseType === 'Yearly' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-gray-300'}`}>Yearly Lease</button>
                        </div>
                     </div>
                     {lead.leaseType === 'Yearly' && (
                       <div>
                          <label className="block text-xs text-gray-400 mb-1">Lease Ends When?</label>
                          <input type="text" value={lead.leaseEnd} onChange={(e) => updateLead('leaseEnd', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                       </div>
                     )}
                     <button onClick={() => setCurrentStep('REASON')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold mt-4">Next: Selling Reason</button>
                  </div>
                );

              case 'VACANT_DURATION':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">How long has it been vacant?</label>
                        <input type="text" value={lead.vacantDuration} onChange={(e) => updateLead('vacantDuration', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <button onClick={() => setCurrentStep('REASON')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold mt-4">Next: Selling Reason</button>
                  </div>
                );
              
              case 'COM_RUN_BY':
                return (
                  <div className="flex flex-col space-y-3 animate-fade-in">
                    <button onClick={() => { updateLead('comRunBy', 'Owner'); setCurrentStep('REASON'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Run by Owner</button>
                    <button onClick={() => { updateLead('comRunBy', 'Tenant'); setCurrentStep('TENANT_DETAILS'); }} className="bg-slate-700 hover:bg-slate-600 text-white py-3 px-4 rounded-lg">Run by Tenant</button>
                  </div>
                );

              case 'REASON':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Reason for Selling (Moving, Divorce, Health, Financial, etc.)</label>
                        <textarea value={lead.reason} onChange={(e) => updateLead('reason', e.target.value)} rows="3" className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none focus:border-blue-500"></textarea>
                     </div>
                     <div className="flex space-x-3">
                       <button onClick={() => setCurrentStep('MORTGAGE')} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Next (Valid Reason)</button>
                       <button onClick={() => setCurrentStep('REASON_INVALID')} className="flex-1 bg-orange-600 hover:bg-orange-500 text-white py-3 rounded font-bold">Invalid Reason (Rebuttal)</button>
                     </div>
                  </div>
                );
              
              case 'REASON_INVALID':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Updated Reason / Motivation Level</label>
                        <textarea value={lead.reason} onChange={(e) => updateLead('reason', e.target.value)} rows="3" className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white outline-none focus:border-blue-500"></textarea>
                     </div>
                     <button onClick={() => setCurrentStep('MORTGAGE')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Continue</button>
                  </div>
                );

              case 'MORTGAGE':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Mortgage / Liens Owed ($)</label>
                        <input type="text" value={lead.mortgage} onChange={(e) => updateLead('mortgage', e.target.value)} placeholder="Amount or 'Paid Off' or 'Refused'" className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <button onClick={() => setCurrentStep('CLOSING_TIME')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Next: Closing Time</button>
                  </div>
                );
              
              case 'CLOSING_TIME':
                return (
                  <div className="space-y-4 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Expected Closing Timeline</label>
                        <input type="text" value={lead.closingTime} onChange={(e) => updateLead('closingTime', e.target.value)} placeholder="e.g., ASAP, 6 months..." className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <button onClick={() => setCurrentStep('CONFIRMATION')} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded font-bold">Next: Confirmation</button>
                  </div>
                );

              case 'CONFIRMATION':
                return (
                  <div className="space-y-3 animate-fade-in">
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Full Name</label>
                        <input type="text" value={lead.fullName} onChange={(e) => updateLead('fullName', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Confirmed Full Address</label>
                        <input type="text" value={lead.propertyAddress} onChange={(e) => updateLead('propertyAddress', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Best Phone Number</label>
                        <input type="text" value={lead.phone} onChange={(e) => updateLead('phone', e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Best Time to Call</label>
                        <input type="text" value={lead.bestTimeToCall} onChange={(e) => updateLead('bestTimeToCall', e.target.value)} placeholder="e.g., Mornings, 5 PM..." className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white" />
                     </div>
                     <div>
                        <label className="block text-xs text-gray-400 mb-1">Additional Notes</label>
                        <textarea value={lead.additionalNotes} onChange={(e) => updateLead('additionalNotes', e.target.value)} rows="2" className="w-full bg-slate-800 border border-slate-700 rounded p-2 text-white"></textarea>
                     </div>
                     <button onClick={() => setCurrentStep('RESULT')} className="w-full bg-green-600 hover:bg-green-500 text-white py-3 rounded font-bold mt-4 shadow-[0_0_15px_rgba(34,197,94,0.4)]">Generate Final Lead</button>
                  </div>
                );
              
              case 'RESULT':
                return (
                  <div className="animate-fade-in">
                    <textarea 
                      readOnly 
                      value={generateOutputText()} 
                      rows="16" 
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-4 text-green-400 font-mono text-sm outline-none resize-none mb-4"
                    />
                    <div className="flex space-x-3">
                      <button 
                        onClick={() => {
                          try {
                             navigator.clipboard.writeText(generateOutputText());
                             showToast("Copied to clipboard!");
                          } catch(e) {
                             showToast("Copy failed, please copy manually.");
                          }
                        }} 
                        className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-lg font-bold flex items-center justify-center gap-2"
                      >
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        Copy Lead
                      </button>
                      <button onClick={resetFlow} className="bg-slate-700 hover:bg-slate-600 text-white px-6 rounded-lg font-bold">New Call</button>
                    </div>
                  </div>
                );

              default: return null;
            }
          };

          const generateOutputText = () => {
            let output = "";
            
            if (lead.propertyType === 'Vacant Lot') {
              const activeUtils = Object.keys(lead.utilities).filter(k => lead.utilities[k]).join(', ');
              
              output += `vacant lot\n`;
              output += `Ap: ${lead.ap || 'N/A'}\n`;
              output += `Mv: ${lead.mv || 'N/A'}\n`;
              output += `-Size: ${lead.size || 'N/A'}\n`;
              output += `-Access ( Cable, Gas, Water, Elec ) : ${activeUtils || 'None specified'}\n`;
              output += `-Res/Com: ${lead.zoning || 'N/A'}\n`;
              output += `-Closing Time: ${lead.closingTime || 'N/A'}\n`;
              output += `-Reason: ${lead.reason || 'N/A'}\n`;
              output += `-Mortgage: ${lead.mortgage || 'N/A'}\n`;
              output += `-Listed: ${lead.listed || 'No'}\n\n`;
            } else {
              let occString = lead.occupancyType || 'N/A';
              if (lead.occupancyType === 'Tenant Occupied') occString += ` (Rent: ${lead.rentAmount}, ${lead.leaseType}, Ends: ${lead.leaseEnd})`;
              if (lead.occupancyType === 'Vacant') occString += ` (Duration: ${lead.vacantDuration})`;
              if (lead.comRunBy) occString += ` (Run by: ${lead.comRunBy})`;

              output += `Property Type: ${lead.propertyType || 'N/A'}\n`;
              output += `Ap: ${lead.ap || 'N/A'}\n`;
              output += `MV: ${lead.mv || 'N/A'}\n`;
              if(lead.propertyType === 'Residential') {
                 output += `bed - bath: ${lead.beds || '0'} - ${lead.baths || '0'}\n`;
              } else {
                 output += `Size: ${lead.size || 'N/A'}\n`;
              }
              output += `upgrades: ${lead.upgrades || 'None'}\n`;
              if(lead.propertyType === 'Residential') output += `roof: ${lead.roofAge || 'N/A'}\n`;
              output += `hvac: ${lead.hvacAge || 'N/A'}\n`;
              output += `needed repairs: ${lead.repairs || 'None'}\n`;
              output += `occupancy: ${occString}\n`;
              output += `Closing time: ${lead.closingTime || 'N/A'}\n`;
              output += `Reason: ${lead.reason || 'N/A'}\n`;
              output += `Mortgage: ${lead.mortgage || 'N/A'}\n`;
              output += `Listed: ${lead.listed || 'No'}\n\n`;
            }

            output += `confirm\n`;
            output += `Full name: ${lead.fullName || 'N/A'}\n`;
            output += `Full address: ${lead.propertyAddress || 'N/A'}\n`;
            output += `Number: ${lead.phone || 'N/A'}\n\n`;
            
            output += `Additional Notes: ${lead.additionalNotes || 'N/A'}\n`;
            output += `Caller Name: ${config.fakeCallerName}\n`;
            output += `Agent Name: ${config.agentName}\n`;
            output += `Mortgage value: ${lead.mortgage || 'N/A'}\n`;
            output += `Best number to call at: ${lead.phone || 'N/A'}\n`;
            output += `Best time to call: ${lead.bestTimeToCall || 'N/A'}`;

            return output;
          };

          return (
            <div className="min-h-screen bg-slate-950 text-slate-200 font-sans p-4 md:p-8 flex flex-col items-center">
              <Toast message={toast.message} show={toast.show} onClose={() => setToast({ show: false, message: ''})} />
              
              <div className="w-full max-w-5xl flex flex-col md:flex-row gap-6">
                
                {/* Main Interface */}
                <div className="flex-1 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl flex flex-col">
                  {/* Header */}
                  <div className="bg-slate-800 p-4 border-b border-slate-700 flex justify-between items-center">
                     <div className="flex items-center gap-2">
                        {stepHistory.length > 0 && currentStep !== 'SETUP' && (
                          <button onClick={goBack} className="mr-2 text-slate-400 hover:text-white transition flex items-center justify-center bg-slate-700 hover:bg-slate-600 p-1.5 rounded" title="Go Back">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7"></path></svg>
                          </button>
                        )}
                        <div className="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                        <h1 className="font-bold text-lg">Live Call Flow</h1>
                     </div>
                     {currentStep !== 'SETUP' && (
                        <button onClick={resetFlow} className="text-sm text-slate-400 hover:text-white transition">Edit Config</button>
                     )}
                  </div>

                  {/* Script Reader Panel */}
                  <div className="bg-blue-900/20 p-6 min-h-[160px] flex items-center border-b border-slate-800">
                     <p className="text-xl md:text-2xl font-semibold leading-relaxed text-blue-100 whitespace-pre-wrap">
                       " {renderScript()} "
                     </p>
                  </div>

                  {/* Action / Input Panel */}
                  <div className="p-6 flex-1 bg-slate-900">
                     {renderStepContent()}
                  </div>
                </div>

                {/* Live Data Summary Sidebar */}
                <div className="w-full md:w-80 bg-slate-900 border border-slate-800 rounded-2xl p-5 h-fit sticky top-8 shadow-xl">
                  <h2 className="text-sm font-bold uppercase tracking-widest text-slate-500 mb-4 border-b border-slate-800 pb-2">Live Data</h2>
                  
                  <div className="space-y-3 text-sm">
                    <div className="flex justify-between">
                      <span className="text-slate-400">Address:</span>
                      <span className="text-white text-right max-w-[150px] truncate">{lead.propertyAddress || '-'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Type:</span>
                      <span className="text-white">{lead.propertyType || '-'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">AP / MV:</span>
                      <span className="text-white">{lead.ap ? `$${lead.ap}` : '-'} / {lead.mv ? `$${lead.mv}` : '-'}</span>
                    </div>
                    {lead.propertyType === 'Residential' && (
                       <div className="flex justify-between">
                         <span className="text-slate-400">Beds/Baths:</span>
                         <span className="text-white">{lead.beds || '0'} / {lead.baths || '0'}</span>
                       </div>
                    )}
                    <div className="flex justify-between">
                      <span className="text-slate-400">Occupancy:</span>
                      <span className="text-white">{lead.occupancyType || '-'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Reason:</span>
                      <span className="text-white truncate max-w-[120px]">{lead.reason || '-'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Mortgage:</span>
                      <span className="text-white">{lead.mortgage || '-'}</span>
                    </div>
                    <div className="flex justify-between">
                      <span className="text-slate-400">Timeline:</span>
                      <span className="text-white">{lead.closingTime || '-'}</span>
                    </div>
                  </div>
                  
                  {currentStep !== 'SETUP' && currentStep !== 'INTRO' && currentStep !== 'RESULT' && (
                     <div className="mt-8 border-t border-slate-800 pt-4">
                        <button onClick={resetFlow} className="w-full text-sm text-red-400 hover:text-red-300 transition py-2 border border-red-900/50 rounded hover:bg-red-900/20">
                           Abandon Lead (Reset)
                        </button>
                     </div>
                  )}
                </div>
              </div>
              
              <style>{`
                @keyframes fadeInUp {
                  from { opacity: 0; transform: translateY(10px); }
                  to { opacity: 1; transform: translateY(0); }
                }
                @keyframes fadeIn {
                  from { opacity: 0; }
                  to { opacity: 1; }
                }
                .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
                .animate-fade-in { animation: fadeIn 0.2s ease-out forwards; }
              `}</style>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LeadGenApp />);
    </script>
</body>
</html>
